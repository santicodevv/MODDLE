name: Secretos

# Escanea con gitleaks los commits nuevos de cada PR y de cada push a main.
# Reglas en .gitleaks.toml; hallazgos históricos ya rotados en .gitleaksignore.
# Si falla: rotá el secreto (aunque borres el commit, ya salió del equipo) y sacalo del código.

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  gitleaks:
    name: Escaneo de secretos
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Rango de commits a revisar
        id: rango
        env:
          BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          if [ -z "$BASE" ] || [ "$BASE" = "0000000000000000000000000000000000000000" ]; then
            echo "log_opts=$HEAD" >> "$GITHUB_OUTPUT"
          else
            echo "log_opts=$BASE..$HEAD" >> "$GITHUB_OUTPUT"
          fi

      - name: gitleaks
        run: |
          docker run --rm -v "$PWD:/repo" zricethezav/gitleaks:v8.21.2 \
            git /repo --config /repo/.gitleaks.toml --gitleaks-ignore-path /repo/.gitleaksignore \
            --log-opts="${{ steps.rango.outputs.log_opts }}" --redact --no-banner -v
